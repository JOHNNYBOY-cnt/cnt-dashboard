const KEY='cntdash:'+D.salt;
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},k,b(D.ct)));
}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(D.salt),iterations:D.iter},m,256));
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){try{show(await decrypt(b(saved)));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}
  document.getElementById('box').style.display='';
})();
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const err=document.getElementById('err'),remember=document.getElementById('rm').checked;
  err.textContent='Opening...';
  let raw,html;
  try{raw=await derive(document.getElementById('pw').value);html=await decrypt(raw)}
  catch(x){err.textContent='Wrong password.';return}
  if(remember){try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(_){}}
  show(html);
};
</script></body></html>
